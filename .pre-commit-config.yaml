repos:
-   repo: local
    hooks:
    -   id: ruff
        name: ruff
        entry: uv run ruff check
        language: system
        types: [python]
    -   id: ty
        name: ty
        entry: uv run ty check
        language: system
        types_or: [python, pyi, jupyter]
        pass_filenames: false
        always_run: true
        require_serial: true