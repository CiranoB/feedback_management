<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Feedback</title>
    <link rel="stylesheet" href="styles.css">
    <script src="auth.js" defer></script>
    <script src="notations.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Community Feedback</h1>
      <div class="auth-bar">
        <label for="auth-token-input">Auth token</label>
        <input id="auth-token-input" name="auth_token" type="password" autocomplete="off">
      </div>
      <div class="session-bar">
        <p>Signed in as <strong id="user-id"></strong></p>
        <form id="user-switcher" class="user-switcher">
          <label for="user-id-input">Switch user</label>
          <input id="user-id-input" name="user_id" required>
          <button type="submit">Switch</button>
        </form>
        <a id="product-manager-link" href="product_manager.html">Product manager view</a>
      </div>
      <form id="feedback-form" class="feedback-form">
        <h2>New feedback</h2>
        <label for="feedback-note">What would you like to share?</label>
        <textarea id="feedback-note" name="note" maxlength="10000"></textarea>
        <label for="feedback-rating">Rating</label>
        <select id="feedback-rating" name="rating" required>
          <option value="1">1 - Bad</option>
          <option value="2">2</option>
          <option value="3" selected>3</option>
          <option value="4">4</option>
          <option value="5">5 - Very good</option>
        </select>
        <button type="submit">Post feedback</button>
      </form>
      <section id="feedback-list" aria-live="polite"></section>
    </main>
  </body>
</html>
